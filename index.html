<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>ThanDenAOV - Huyền Thoại Hải Tặc</title>
<style>
body{
 margin:0;
 background:#0a1220;
 color:#eee;
 font-family:Arial
}
#header{
 background:linear-gradient(#1a2a4a,#0f1a30);
 padding:10px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:2px solid gold
}
#logo{
 font-weight:bold;
 color:gold;
 font-size:20px
}
#menu{
 display:flex;
 gap:8px;
 background:#112233;
 padding:8px;
 overflow:auto
}
#menu button{
 background:#1e3a5a;
 color:white;
 border:1px solid #0ff3;
 padding:8px 12px;
 border-radius:8px;
 white-space:nowrap
}
#main{
 display:flex;
 flex-wrap:wrap;
 gap:10px;
 padding:10px
}
.box{
 background:#152238;
 border:1px solid #2a4a6a;
 border-radius:12px;
 padding:10px;
 flex:1;
 min-width:280px
}
</style>
</head>
<body>
<div id="header">
 <div id="logo">⚓ ThanDenAOV.COM</div>
 <div>
  <button>🔍</button>
  <button>👤 Đăng nhập</button>
 </div>
</div><div id="menu">
 <button onclick="show('home')">🏠 Trang chủ</button>
 <button onclick="show('tuong')">👥 Tướng</button>
 <button onclick="show('chiêu')">🍺 Chiêu mộ</button>
 <button onclick="show('dao')">🏝️ Đảo 1-50</button>
 <button onclick="show('pvp')">⚔️ PvP Online</button>
 <button onclick="show('shop')">🏪 Cửa hàng</button>
 <button onclick="show('code')">🎁 Giftcode</button>
</div>

<div id="main">
 <div class="box">
  <h3>📢 Thông báo</h3>
  <div style="background:#0006;padding:8px;border-radius:8px">
   🔥 Server mới S50 vừa mở!<br>
   🎁 Nhập code: TANDEN50 - Nhận 100 thùng bia 🍻<br>
   ⚔️ Giải đấu PvP Liên Server tối nay 20h
  </div>
  <h3 style="margin-top:12px">🏝️ Hành trình</h3>
  <div id="daoList" style="display:flex;flex-wrap:wrap;gap:4px"></div>
 </div>

 <div class="box">
  <h3>💬 Diễn đàn - Thảo luận</h3>
  <div id="posts"></div>
  <input id="newPost" placeholder="Viết bài thảo luận..." style="width:70%;padding:8px;border-radius:8px">
  <button onclick="postBai()" style="padding:8px 12px;background:gold;border-radius:8px">Đăng</button>
 </div> <div class="box">
  <h3>🚢 Sảnh chờ - Bến cảng</h3>
  <div style="background:linear-gradient(#4db8ff,#1e90ff 60%,#ffe4a0 80%);height:160px;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative">
   <div style="font-size:70px">🚢</div>
   <div style="position:absolute;bottom:8px;left:8px;background:#0008;padding:4px 8px;border-radius:8px;font-size:12px">Thousand Sunny</div>
   <div style="position:absolute;top:8px;right:8px;background:#0008;padding:4px 8px;border-radius:8px">Đảo: <span id="curDao">1</span>/50</div>
  </div>
  <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
   <button onclick="quay('thuong')" style="flex:1;background:#ffcc00;padding:10px;border-radius:10px">Quay 🍺<br><small>100 vàng</small></button>
   <button onclick="quay('vip')" style="flex:1;background:#ff4444;color:white;padding:10px;border-radius:10px">Quay 🍻<br><small>10 KC</small></button>
  </div>
  <div id="doiHinh" style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px"></div>
  <div id="log" style="margin-top:8px;background:#0006;padding:6px;border-radius:8px;min-height:20px">Chào mừng thuyền trưởng!</div>
 </div>
</div><script>
let vang=999, kc=1510, dao=1;
let my=['luffy'];
const TUONG=[
 {id:'luffy',ten:'Luffy G5',hiem:'SSR',skill:'Bajrang Gun'},
 {id:'zoro',ten:'Zoro',hiem:'SSR',skill:'Asura'},
 {id:'shanks',ten:'Shanks',hiem:'SSR',skill:'Divine Departure'},
 {id:'nami',ten:'Nami',hiem:'SR',skill:'Zeus'},
 {id:'sanji',ten:'Sanji',hiem:'SR',skill:'Ifrit'},
 {id:'usopp',ten:'Usopp',hiem:'R',skill:'Green Star'}
];
let baidang=[
 {user:'BaoHoaiNTHB',nd:'Vừa quay ra Shanks SSR từ thùng 🍻 xịn quá!',like:12},
 {user:'ZoroFan',nd:'Ai chỉ cách qua đảo 25 với, boss khó quá',like:5},
 {user:'Admin',nd:'Event x2 tỉ lệ SSR cuối tuần này nhé anh em',like:30}
];

function renderDao(){
 let h='';
 for(let i=1;i<=50;i++){
  let cls=i==dao?'style="background:gold;color:black"':i<dao?'style="background:#0a3"':'style="background:#333;opacity:0.5"';
  h+=`<div ${cls} style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%;font-size:12px">${i}</div>`;
 }
 document.getElementById('daoList').innerHTML=h;
 document.getElementById('curDao').innerText=dao;
}
function renderPost(){
 document.getElementById('posts').innerHTML=baidang.map(b=>`
  <div style="background:#0f223a;padding:8px;margin:6px 0;border-radius:8px;border-left:3px solid gold">
   <b>${b.user}</b> <small style="color:#aaa">• vừa xong</small><br>
   ${b.nd}<br>
   <small>❤️ ${b.like} 👍 💬</small>
  </div>
 `).join('');
}
function renderDoi(){
 document.getElementById('doiHinh').innerHTML=my.map(id=>{
  let t=TUONG.find(x=>x.id==id);
  return `<div style="background:#0006;padding:4px 6px;border-radius:6px;font-size:12px;border:1px solid ${t.hiem=='SSR'?'gold':'#0ff'}">${t.ten} [${t.hiem}]</div>`;
 }).join('');
}function quay(loai){
 if(loai=='thuong'&&vang<100){alert('Hết vàng');return;}
 if(loai=='vip'&&kc<10){alert('Hết KC');return;}
 if(loai=='thuong') vang-=100; else kc-=10;
 let hiem=loai=='vip'?(Math.random()<0.5?'SSR':'SR'):(Math.random()<0.05?'SSR':Math.random()<0.3?'SR':'R');
 let pool=TUONG.filter(x=>x.hiem==hiem);
 if(pool.length==0) pool=TUONG;
 let ra=pool[Math.floor(Math.random()*pool.length)];
 my.push(ra.id);
 renderDoi();
 document.getElementById('log').innerText='🎉 Quay '+(loai=='vip'?'🍻':'🍺')+' ra '+ra.ten+' ['+ra.hiem+'] - Skill: '+ra.skill;
}
function postBai(){
 let v=document.getElementById('newPost').value;
 if(!v) return;
 baidang.unshift({user:'Bạn',nd:v,like:0});
 document.getElementById('newPost').value='';
 renderPost();
}
function show(tab){
 if(tab=='home'){window.scrollTo(0,0);}
 if(tab=='tuong'){alert('Đội hình: '+my.join(', ')+'\nMỗi tướng có 3 skill riêng, hiệu ứng 3D');}
 if(tab=='chiêu'){alert('Bấm nút Quay 🍺 Thường 100 vàng, 🍻 Xịn 10 KC để ra tướng SSR');}
 if(tab=='dao'){let d=prompt('Nhập đảo muốn đến 1-50',dao); if(d){dao=Math.min(50,parseInt(d)); renderDao();}}
 if(tab=='pvp'){let e=TUONG[Math.floor(Math.random()*TUONG.length)]; alert('⚔️ PvP Online vs '+e.ten+' - '+(Math.random()>0.4?'Thắng!':'Thua!')); }
}
renderDao(); renderPost(); renderDoi();
</script>
</body>
</html>
