<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>OP3D</title><style>body{margin:0;overflow:hidden;background:#001a33;color:#fff;font-family:Arial}#c{position:fixed;top:0;left:0;width:100%;height:100%}#u{position:fixed;top:0;left:0;width:100%}#t{background:#0008;padding:6px;display:flex;flex-wrap:wrap;gap:4px}button{padding:6px8px;border:0;border-radius:6px;font-weight:bold}#l{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);background:#000a;padding:6px 12px;border-radius:12px}</style><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script></head><body><canvas id="c"></canvas><div id="u"><div id="t"></div></div><div id="l">One Piece 3D</div><script type="module">import*as T from'three';const CH=[{i:'luffy',n:'Luffy G5',r:'SSR',c:0xff3300},{i:'zoro',n:'Zoro',r:'SSR',c:0x00ff88},{i:'shanks',n:'Shanks',r:'SSR',c:0xf00},{i:'nami',n:'Nami',r:'SR',c:0xfa0},{i:'usopp',n:'Usopp',r:'R',c:0x8f0}];let my=[],g=500,d=50,sel=CH[0],cur=1;const sc=new T.Scene();sc.background=new T.Color(0x4db8ff);const cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);cam.position.set(0,5,10);const ren=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});ren.setSize(innerWidth,innerHeight);sc.add(new T.AmbientLight(0xffffff,0.8));const gr=new T.Group();sc.add(gr);function sp(c){gr.clear();let m=new T.Mesh(new T.CapsuleGeometry(0.5,1,4,8),new T.MeshStandardMaterial({color:c.c}));m.position.y=1;gr.add(m);}function ui(){document.getElementById('t').innerHTML=`<button onclick="ga('n')">🍺${g}</button><button onclick="ga('v')">🍻${d}</button><button onclick="isl()">Đảo ${cur}/50</button><button onclick="pvp()">⚔️PvP</button>${my.map(x=>{let y=CH.find(z=>z.i==x);return`<button onclick="se('${y.i}')">${y.n}</button>`}).join('')}`;}window.ga=(t)=>{if(t=='n'&&g<100)return alert('het vang');if(t=='v'&&d<10)return alert('het kc');if(t=='n')g-=100;else d-=10;let h=t=='v'? (Math.random()<0.5?'SSR':'SR') : (Math.random()<0.05?'SSR':Math.random()<0.3?'SR':'R');let p=CH.filter(a=>a.r==h);if(!p.length)p=CH;let ch=p[Math.floor(Math.random()*p.length)];my.push(ch.i);sel=ch;sp(ch);ui();document.getElementById('l').innerText='Ra '+ch.n+' ['+ch.r+']';};window.se=(i)=>{sel=CH.find(a=>a.i==i);sp(sel);document.getElementById('l').innerText=sel.n;};window.isl=()=>{if(cur>=50)return alert('Win!');if(Math.random()>0.3){cur++;g+=100;ui();document.getElementById('l').innerText='Thang dao '+(cur-1)+'!';}else document.getElementById('l').innerText='Thua boss '+cur;};window.pvp=()=>{let e=CH[Math.floor(Math.random()*CH.length)];let w=Math.random()>0.4;document.getElementById('l').innerText=(w?'Thang ':'Thua ')+e.n;if(w)g+=50;ui();};ui();sp(sel);(function a(t){requestAnimationFrame(a);gr.rotation.y+=0.01;ren.render(sc,cam);})(0);</script></body></html>
