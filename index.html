<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>One Piece 3D</title>
<style>
body{
 margin:0;
 background:#001a33;
 color:white;
 font-family:Arial;
 overflow:hidden
}
#c{
 position:fixed;
 top:0;left:0;
 width:100%;
 height:100%
}
#ui{
 position:fixed;
 top:0;left:0;
 width:100%;
 padding:10px
}
button{
 padding:10px;
 margin:4px;
 border:0;
 border-radius:8px;
 font-weight:bold
}
</style>
</head>
<body>
  <canvas id="c"></canvas>
<div id="ui">
 <h3>🏴‍☠️ ONE PIECE 50 ĐẢO</h3>
 <div>
  <button onclick="quay('thuong')">
   Quay Thường 🍺 100 vàng
  </button>
  <button onclick="quay('vip')">
   Quay Xịn 🍻 10 KC
  </button>
 </div>
 <div>
  Vàng: <span id="gold">500</span>
  KC: <span id="gem">50</span>
  Đảo: <span id="island">1</span>/50
 </div>
 <div id="team"></div>
 <div>
  <button onclick="danhBoss()">
   Đánh Boss ➡️
  </button>
  <button onclick="pvp()">
   ⚔️ PvP Online
  </button>
 </div>
</div>
<div id="log" style="position:fixed;bottom:20px;left:10px;background:#000a;padding:8px;border-radius:10px"></div>
<script type="importmap">
{
 "imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js"
 }
}
</script>
<script type="module">
import * as THREE from 'three';// DATA TƯỚNG
const TUONG=[
 {id:'luffy',ten:'Luffy G5',hiem:'SSR',mau:0xff3300},
 {id:'zoro',ten:'Zoro',hiem:'SSR',mau:0x00ff88},
 {id:'shanks',ten:'Shanks',hiem:'SSR',mau:0xff0000},
 {id:'nami',ten:'Nami',hiem:'SR',mau:0xffaa00},
 {id:'sanji',ten:'Sanji',hiem:'SR',mau:0x0088ff},
 {id:'usopp',ten:'Usopp',hiem:'R',mau:0x88ff00}
];
let myTuong=[];
let vang=500;
let kimcuong=50;
let dao=1;
let chon=null;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x4db8ff);
const camera=new THREE.PerspectiveCamera(
 60,window.innerWidth/window.innerHeight,
 0.1,100
);
camera.position.set(0,5,10);
const renderer=new THREE.WebGLRenderer({
 canvas:document.getElementById('c'),
 antialias:true
});
renderer.setSize(window.innerWidth,window.innerHeight);
scene.add(new THREE.AmbientLight(0xffffff,0.9));
const group=new THREE.Group();
scene.add(group);function tao3D(mau){
 group.clear();
 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(0.5,1,4,8),
  new THREE.MeshStandardMaterial({color:mau})
 );
 body.position.y=1;
 group.add(body);
}
function capNhat(){
 document.getElementById('gold').innerText=vang;
 document.getElementById('gem').innerText=kimcuong;
 document.getElementById('island').innerText=dao;
 document.getElementById('team').innerHTML=
  myTuong.map(id=>{
   let t=TUONG.find(x=>x.id==id);
   return `<button onclick="chonTuong('${t.id}')">${t.ten} [${t.hiem}]</button>`;
  }).join(' ');
}
window.chonTuong=(id)=>{
 chon=TUONG.find(x=>x.id==id);
 tao3D(chon.mau);
 document.getElementById('log').innerText=
  chon.ten+' - Skill: '+['Pistol','Haki','Ultimate'].join(' - ');
};
window.quay=(loai)=>{
 if(loai=='thuong'&&vang<100){
  alert('Hết vàng!');return;
 }
 if(loai=='vip'&&kimcuong<10){
  alert('Hết KC!');return;
 }
 if(loai=='thuong') vang-=100;
 else kimcuong-=10; let hiem='';
 if(loai=='vip'){
  hiem=Math.random()<0.5?'SSR':'SR';
 }else{
  let r=Math.random();
  if(r<0.05) hiem='SSR';
  else if(r<0.3) hiem='SR';
  else hiem='R';
 }
 let pool=TUONG.filter(x=>x.hiem==hiem);
 if(pool.length==0) pool=TUONG;
 let ra=pool[Math.floor(Math.random()*pool.length)];
 myTuong.push(ra.id);
 chonTuong(ra.id);
 capNhat();
 document.getElementById('log').innerText=
  '🎉 Ra '+ra.ten+' ['+ra.hiem+'] '+(loai=='vip'?'🍻':'🍺');
};
window.danhBoss=()=>{
 if(!chon){alert('Chọn tướng!');return;}
 if(Math.random()>0.3){
  dao=Math.min(50,dao+1);
  vang+=100;
  capNhat();
  document.getElementById('log').innerText='Thắng Boss! Lên đảo '+dao;
 }else{
  document.getElementById('log').innerText='Thua Boss đảo '+dao+' rồi!';
 }
};
window.pvp=()=>{
 let dich=TUONG[Math.floor(Math.random()*TUONG.length)];
 let thang=Math.random()>0.4;
 if(thang) vang+=50;
 capNhat();
 document.getElementById('log').innerText=
  (thang?'Thắng ':'Thua ')+dich.ten+' ⚔️';
};
capNhat();
tao3D(0xff3300);
(function loop(){
 requestAnimationFrame(loop);
 group.rotation.y+=0.01;
 renderer.render(scene,camera);
})();
</script>
</body>
</html>
